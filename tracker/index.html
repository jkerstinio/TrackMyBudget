<html lang="de">
<head>

<title>TrackMyBudget</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22%234a78d6%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%224.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%2213%22%20y%3D%2219%22%20width%3D%2238%22%20height%3D%2226%22%20rx%3D%227%22%2F%3E%3Cline%20x1%3D%2213%22%20y1%3D%2229%22%20x2%3D%2251%22%20y2%3D%2229%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
:root{
  --bg:oklch(98.3% .004 80);--surface:oklch(100% 0 0);--border:oklch(91.5% .006 80);--text:oklch(23% .012 80);
  --text-muted:oklch(52% .014 80);--text-faint:oklch(70% .012 80);--accent:oklch(58% .15 260);--accent-soft:oklch(94% .028 260);
  --positive:oklch(58% .13 150);--positive-soft:oklch(94.5% .04 150);--negative:oklch(58% .17 25);--negative-soft:oklch(95% .03 25);
  --warning:oklch(62% .14 85);--warning-soft:oklch(95% .05 85);--rigid:oklch(62% .01 80);--hover:oklch(97% .005 80);
  --cbg:93%;--cfg:36%;--ctx:55%;
  --r-md:11px;--r-lg:16px;--sidebar:240px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:oklch(19% .006 80);--surface:oklch(23.5% .007 80);--border:oklch(32% .008 80);--text:oklch(94% .006 80);
  --text-muted:oklch(72% .01 80);--text-faint:oklch(54% .01 80);--accent:oklch(72% .13 260);--accent-soft:oklch(31% .06 260);
  --positive:oklch(74% .15 150);--positive-soft:oklch(30% .05 150);--negative:oklch(72% .16 25);--negative-soft:oklch(31% .05 25);
  --warning:oklch(78% .13 85);--warning-soft:oklch(32% .05 85);--hover:oklch(27% .007 80);--cbg:32%;--cfg:86%;--ctx:75%;
}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;overflow-x:hidden}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{border:1.5px solid var(--border);background:var(--surface);border-radius:var(--r-md);padding:9px 13px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=checkbox]{padding:0;width:15px;height:15px;accent-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent)}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);flex-shrink:0;border-right:1px solid var(--border);padding:28px 20px;height:100vh;position:sticky;top:0;display:flex;flex-direction:column;gap:22px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px;font-weight:800;font-size:17px;letter-spacing:-.02em}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff}
.gf{display:flex;flex-direction:column;gap:8px}
.gf select,.gf input{font-size:13px;font-weight:600;padding:9px 12px}
.gf .rr{display:flex;gap:6px;align-items:center}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--text-muted);font-weight:600;font-size:14px;border:0;background:none;text-align:left;position:relative}
.nav button:hover{background:var(--hover)}
.nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.badge-n{margin-left:auto;background:var(--negative);color:#fff;border-radius:9px;min-width:18px;height:18px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.side-foot{margin-top:auto}
.status{font-size:11.5px;color:var(--text-faint);padding:0 4px 10px}.status b{color:var(--positive)}.status b.bad{color:var(--negative)}
.content{flex:1;min-width:0}
.page{padding:40px 48px 80px;max-width:1600px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.ph h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--text-muted);margin-top:4px;font-size:13.5px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--r-md);border:1.5px solid var(--border);background:var(--surface);font-weight:700;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.block{width:100%;justify-content:center}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--text-muted);padding:7px 9px}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.danger:hover{color:var(--negative);border-color:var(--negative)}
.btn:disabled{opacity:.45;cursor:default}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px 24px;margin-bottom:20px}
.panel h2{font-size:16px;font-weight:700}
.panel .sub{margin:2px 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px}
.card .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;background:var(--accent-soft);color:var(--accent)}
.card .ic.pos{background:var(--positive-soft);color:var(--positive)}.card .ic.neg{background:var(--negative-soft);color:var(--negative)}
.card .lab{font-size:13px;color:var(--text-muted);font-weight:600}
.card .val{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:3px 0 4px;font-variant-numeric:tabular-nums}
.card .note{font-size:12.5px;color:var(--text-faint)}
.cards.compact{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.cards.compact .card{padding:13px 16px}.cards.compact .val{font-size:22px;margin:1px 0}.cards.compact .ic{display:none}
.pos{color:var(--positive)}.neg{color:var(--negative)}.warn{color:var(--warning)}.muted{color:var(--text-muted)}.faint{color:var(--text-faint)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
@media(max-width:1250px){.grid2{grid-template-columns:1fr}}
@media(max-width:840px){.app{flex-direction:column}.sidebar{width:100%;height:auto;position:static;padding:14px}.nav{flex-direction:row;flex-wrap:wrap}.page{padding:20px 14px 80px}}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fchip{padding:6px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-size:12.5px;font-weight:600}
.fchip:hover{border-color:var(--accent)}
.fchip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:11px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:600;font-size:13px;color:var(--text-muted)}
.seg button.on{background:var(--text);color:var(--bg)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar input[type=search],.toolbar input[type=text]{min-width:220px}
.toolbar .sp{flex:1}
.cb{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:oklch(var(--cbg) calc(.06*var(--k,1)) var(--h,0));color:oklch(var(--cfg) calc(.1*var(--k,1)) var(--h,0));white-space:nowrap}
.cic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;background:oklch(var(--cbg) calc(.06*var(--k,1)) var(--h,0));flex-shrink:0}
.tagc{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;border:1px solid var(--border);font-size:11.5px;font-weight:600;color:var(--text-muted);white-space:nowrap}
.tagc.big{padding:6px 12px;font-size:13px;border-width:1.5px;border-color:oklch(var(--ctx) calc(.12*var(--k,1)) var(--h,260));color:oklch(var(--ctx) calc(.13*var(--k,1)) var(--h,260));background:oklch(var(--cbg) calc(.04*var(--k,1)) var(--h,260))}
.tagc.big button{border:0;background:none;padding:0;color:inherit;display:flex;opacity:.7}
.tagc.sug{border:1.5px dashed oklch(var(--ctx) calc(.12*var(--k,1)) var(--h,260));color:oklch(var(--ctx) calc(.13*var(--k,1)) var(--h,260));background:none;cursor:pointer;padding:5px 11px;font-size:12px}
.tagrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tagrow input{border:1.5px dashed var(--border);border-radius:99px;padding:6px 14px;font-size:13px;background:none;min-width:150px;flex:1}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);font-weight:700;padding:10px 10px}
td{padding:12px 10px;border-top:1px solid var(--border);vertical-align:middle}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--hover)}
tr.sel{background:var(--accent-soft)}
.t-desc{font-weight:600}.t-note{font-size:12px;color:var(--text-faint);font-weight:500}
.rowact{opacity:0;white-space:nowrap}tr:hover .rowact{opacity:1}
.list .it{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--border)}
.list .it:first-child{border-top:0}
.list .it .m{flex:1;min-width:0}.list .it .m b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .m small{color:var(--text-muted);font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.list .it .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border-radius:5px;background:var(--bg);overflow:hidden;position:relative;border:1px solid var(--border)}
.bar i{display:block;height:100%;border-radius:5px}
.brow{padding:9px 0}.brow .top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brow .top .n{font-weight:600;flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--border);color:var(--text-muted)}
.pill.ok{background:var(--positive-soft);color:var(--positive);border-color:transparent}.pill.mid{background:var(--warning-soft);color:var(--warning);border-color:transparent}.pill.bad{background:var(--negative-soft);color:var(--negative);border-color:transparent}
.tempo{font-size:12px;color:var(--text-faint);margin-top:5px}
.drop{border:2px dashed var(--border);border-radius:var(--r-lg);padding:22px;text-align:center;margin-bottom:18px;cursor:pointer;color:var(--text-muted);font-size:13px;transition:.15s}
.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block;color:var(--text);font-size:14px;margin-bottom:2px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.cgc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;display:flex;gap:10px;align-items:center}
.cgc .cic{margin-right:4px}.cgc .m{flex:1;min-width:0}.cgc .m b{display:block}.cgc .m small{color:var(--text-muted)}
.heat{border-collapse:separate;border-spacing:2px;width:100%}
.heat th{text-align:center;font-size:11px;padding:3px 2px;text-transform:none;letter-spacing:0}
.heat td{text-align:center;font-size:12px;padding:6px 2px;border:0;border-radius:6px;font-variant-numeric:tabular-nums}
.heat th.sortable{cursor:pointer;user-select:none;border-radius:6px}.heat th.sortable:hover{background:var(--hover);color:var(--text)}.heat th.sorted{color:var(--accent)}
.heat td.n{text-align:left;white-space:nowrap;padding-right:12px}
.yv td{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}.yv td:first-child{text-align:left;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;margin-top:8px;color:var(--text-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:20px;border-top:3px solid}
svg text{fill:var(--text-muted);font-size:11px;font-family:inherit}
dialog{border:1px solid var(--border);border-radius:20px;background:var(--surface);color:var(--text);padding:0;width:min(560px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog.wide{width:min(820px,95vw)}
dialog::backdrop{background:rgba(20,20,25,.45)}
.dlg{padding:24px 26px;display:grid;gap:16px}
.dlg h2{font-size:19px;font-weight:800}
.field{display:grid;gap:6px}.field>label,.field>span{font-size:12.5px;font-weight:700;color:var(--text-muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.amount{font-size:28px;font-weight:800;padding:12px 16px}
.chipsel{display:flex;flex-wrap:wrap;gap:7px}
.chipsel button{padding:7px 13px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);font-weight:600;font-size:13px}
.chipsel button.on{border-color:oklch(var(--ctx) calc(.13*var(--k,1)) var(--h,260));background:oklch(var(--cbg) calc(.05*var(--k,1)) var(--h,260));color:oklch(var(--cfg) calc(.12*var(--k,1)) var(--h,260))}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.okbox{background:var(--positive-soft);color:var(--text);border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.5}.warnbox{background:var(--warning-soft);color:var(--warning);border-radius:var(--r-md);padding:10px 14px;font-size:13px;font-weight:600;display:grid;gap:3px}
.errbox{background:var(--negative-soft);color:var(--negative);border-radius:var(--r-md);padding:10px 14px;font-size:13px;font-weight:600}
.ritems{max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:var(--r-md)}
.ri{display:grid;grid-template-columns:1fr 170px 90px 34px;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--border)}
.ri:first-child{border-top:0}.ri.ex{opacity:.4}.ri select,.ri input{padding:6px 8px;font-size:13px}.ri small{color:var(--text-faint);display:block}
.ri .nm{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ri select.unsure{border-color:var(--warning)}
.rsum{display:flex;justify-content:space-between;padding:10px 14px;border-radius:var(--r-md);background:var(--bg);font-size:13px}.rsum.bad{background:var(--negative-soft);color:var(--negative)}
.toast{position:fixed;bottom:22px;right:22px;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:99}
.dropfull{position:fixed;inset:0;background:color-mix(in oklab,var(--accent) 22%,transparent);border:4px dashed var(--accent);z-index:50;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:var(--accent);pointer-events:none}
.splash{max-width:560px;margin:14vh auto;text-align:center;padding:0 20px}.splash h1{margin:14px 0 8px}.splash p{color:var(--text-muted);margin-bottom:20px;line-height:1.5}
.gfi{position:relative}
.gfc{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:13px;text-align:left}
.gfc:hover,.gfc.open{border-color:var(--accent)}
.gfp{position:absolute;top:calc(100% + 6px);left:0;min-width:270px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:0 12px 36px rgba(0,0,0,.18);z-index:30;display:grid;gap:10px}
.gfp .lab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}
.gfp .row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:9px;border:0;background:none;font-weight:600;font-size:13px;text-align:left;width:100%}
.gfp .row:hover{background:var(--hover)}.gfp .row.on{background:var(--accent-soft);color:var(--accent)}
.gfp .seg{display:flex}.gfp .seg button{flex:1;padding:6px 8px;font-size:12px}
.gfp input[type=month]{padding:7px 9px;font-size:12.5px;flex:1}
.typerow{display:flex;flex-wrap:wrap;gap:10px}
.tb{padding:13px 16px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;flex:1;justify-content:center;white-space:nowrap}
.tb:hover{border-color:var(--text-faint)}
.tb.exp.on{background:var(--negative-soft);border-color:var(--negative);color:var(--negative)}
.tb.inc.on{background:var(--positive-soft);border-color:var(--positive);color:var(--positive)}
.tb.acc.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chipsel button .ci{margin-right:6px;font-size:13px}
.chipsel button.more{border-style:dashed;color:var(--text-muted)}
.qd{display:flex;gap:6px;margin-top:6px}.qd button{flex:1;padding:6px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-weight:700;font-size:12.5px}.qd button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.bq{border-top:1px solid var(--border);padding:12px 0;display:grid;gap:8px}.bq:first-of-type{border-top:0}.bqh{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bqm{min-width:0;flex:1}.bqm b{font-size:15px;margin-right:6px}.bqm small{display:block;color:var(--text-muted);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}.bqa{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.bqc{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.bqc .sp{flex:1}
.qchip{display:inline-flex;align-items:center;gap:5px;border:1px solid color-mix(in oklab,oklch(70% calc(.14*var(--k)) var(--h)) 45%,var(--border));background:color-mix(in oklab,oklch(70% calc(.14*var(--k)) var(--h)) 12%,var(--surface));border-radius:99px;padding:4px 11px;font:inherit;font-size:13px;font-weight:600;color:var(--text);cursor:pointer}
.qchip:hover{background:color-mix(in oklab,oklch(70% calc(.14*var(--k)) var(--h)) 26%,var(--surface))}.qsel{font-size:13px;padding:4px 8px;border-radius:99px}

<body>

<script>
"use strict";
/* ============================ Hilfsfunktionen ============================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NF = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" });
const NF0 = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const eur = n => NF.format(n || 0), eur0 = n => NF0.format(n || 0);
const seur = n => (n > 0 ? "+" : "") + eur(n);
const pad = n => String(n).padStart(2, "0");
const mkey = (y, m) => `${y}-${pad(m)}`;
const parseM = k => { const [y, m] = k.split("-").map(Number); return { y, m }; };
const addM = (k, d) => { let { y, m } = parseM(k); m += d; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return mkey(y, m); };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const nowM = () => todayStr().slice(0, 7);
const MON = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const MONL = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const mShort = k => { const { y, m } = parseM(k); return `${MON[m - 1]} ${String(y).slice(2)}`; };
const mLong = k => { const { y, m } = parseM(k); return `${MONL[m - 1]} ${y}`; };
const dFmt = s => { const { y, m } = parseM(s.slice(0, 7)); return `${Number(s.slice(8))}. ${MON[m - 1]}. ${y}`; };
const dRel = s => { const t = todayStr(); if (s === t) return "Heute"; const y = new Date(); y.setDate(y.getDate() - 1); if (s === `${y.getFullYear()}-${pad(y.getMonth() + 1)}-${pad(y.getDate())}`) return "Gestern"; return dFmt(s); };
const range = (a, b) => { const out = []; for (let k = a; k <= b; k = addM(k, 1)) out.push(k); return out; };
const sum = a => a.reduce((s, v) => s + v, 0);
const mean = a => a.length ? sum(a) / a.length : 0;
const r2 = n => Math.round(n * 100) / 100;
// Rechenausdrücke wie "12,50+3,20*2" oder "(100-20)/4": Zahlen mit Komma oder Punkt, + - * / x : ( ), Punkt vor Strich, ohne eval
function calcExpr(s) {
  const str = String(s).replace(/×/g, "*").replace(/÷/g, "/").replace(/\s+/g, "");
  const toks = str.match(/\d+(?:[.,]\d+)*|[-+*/x:()]/gi);
  if (!toks || toks.join("") !== str) return null;
  const num = t => { const c = t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : (t.split(".").length > 2 ? t.replace(/\./g, "") : t); return parseFloat(c); };
  let i = 0;
  const atom = () => {
    const t = toks[i++]; if (t === undefined) throw 0;
    if (t === "(") { const v = sumE(); if (toks[i++] !== ")") throw 0; return v; }
    if (t === "-") return -atom(); if (t === "+") return atom();
    if (/^\d/.test(t)) return num(t); throw 0;
  };
  const prod = () => { let v = atom(); while (/^[*/x:]$/i.test(toks[i] || "")) { const o = toks[i++]; const r = atom(); v = /[*x]/i.test(o) ? v * r : v / r; } return v; };
  const sumE = () => { let v = prod(); while (toks[i] === "+" || toks[i] === "-") { const o = toks[i++]; const r = prod(); v = o === "+" ? v + r : v - r; } return v; };
  try { const v = sumE(); return i === toks.length && isFinite(v) ? v : null; } catch { return null; }
}
const isExpr = t => /[+*/x:()×÷]/i.test(t) || /\d\s*-/.test(t);
const parseAmount = s => {
  const t = String(s).trim(); if (!t) return null;
  if (isExpr(t)) { const v = calcExpr(t); return v == null ? null : r2(v); }
  const n = parseFloat(t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t); return isNaN(n) ? null : n;
};
const fmtNum = n => r2(n).toFixed(2).replace(".", ",");
const nextId = arr => arr.reduce((m, x) => Math.max(m, x.id), 0) + 1;
const ICONS = { cart: "🛒", ticket: "🎟️", cup: "🥤", house: "🏠", car: "🚗", repeat: "🔁", "heart-pulse": "💊", gift: "🎁", dumbbell: "🏋️", briefcase: "💼", shield: "🛡️", shirt: "👕", dots: "⋯", paw: "🐾", "palm-tree": "🌴", cookie: "🍪", "graduation-cap": "🎓", "bar-chart": "📈" };
const hueStyle = c => `--h:${c?.hue ?? 0};--k:${c?.hue == null ? 0 : 1}`;
const colorOf = (c, l = 68) => c && c.hue != null ? `oklch(${l}% .13 ${c.hue})` : `oklch(${l}% .01 80)`;
const SVGP = {
  box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  split: '<path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.17-2.87L3 3"/><path d="m15 9 6-6"/>',
  inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  list: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r=".6"/><circle cx="3.5" cy="12" r=".6"/><circle cx="3.5" cy="18" r=".6"/>',
  repeat: '<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
  target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  chart: '<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  tag: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r=".8"/>',
  hash: '<line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/>',
  wallet: '<rect x="2" y="5" width="20" height="14" rx="3"/><line x1="2" y1="10" x2="22" y2="10"/>',
  up: '<line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/>',
  down: '<line x1="7" y1="7" x2="17" y2="17"/><polyline points="17 7 17 17 7 17"/>',
  trend: '<polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/>',
  chevron: '<polyline points="6 9 12 15 18 9"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  receipt: '<path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 1 1V2z"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/>',
};
const ic = (n, s = 18, w = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${SVGP[n] || ""}</svg>`;

/* ============================ Speicher: Ordner mit JSON-Dateien ============================ */
const FILES = ["accounts", "categories", "tags", "budgets", "account_weights", "recurring", "receipt_rules", "transactions", "trash", "depot_values", "bank_rules", "bank_ack"];
const DB = Object.fromEntries(FILES.map(f => [f, []]));
const Store = {
  dir: null, mode: "none", dirty: new Set(), timer: null, error: null, lastSaved: null, pending: null,
  supported: "showDirectoryPicker" in window,
  idb() { return new Promise((res, rej) => { const r = indexedDB.open("tmb", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async kvGet(k) { const db = await this.idb(); return new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); },
  async kvSet(k, v) { const db = await this.idb(); return new Promise(res => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); }); },
  async init() {
    if (this.supported) {
      try {
        const h = await this.kvGet("dir");
        if (h && (await h.queryPermission({ mode: "readwrite" })) === "granted") { this.dir = h; await this.loadDir(); return; }
        this.pending = h || null;
      } catch (e) { console.warn(e); }
      return;
    }
    this.loadLocal();
  },
  async pick() { const h = await showDirectoryPicker({ mode: "readwrite", id: "tmb" }); this.dir = h; await this.kvSet("dir", h); await this.loadDir(); },
  async regrant() { if (await this.pending.requestPermission({ mode: "readwrite" }) === "granted") { this.dir = this.pending; await this.loadDir(); } },
  async loadDir() {
    for (const f of FILES) {
      try { const fh = await this.dir.getFileHandle(f + ".json"); DB[f] = JSON.parse(await (await fh.getFile()).text()); }
      catch (e) { if (e.name === "NotFoundError") DB[f] = []; else throw e; }
    }
    this.mode = "dir"; this.afterLoad();
  },
  loadLocal() { this.mode = "local"; try { Object.assign(DB, JSON.parse(localStorage.getItem("tmb-db") || "{}")); } catch { } this.afterLoad(); },
  afterLoad() {
    for (const f of FILES) DB[f] ||= [];
    if (!DB.accounts.length) { DB.accounts = [{ id: 1, name: "Persönlich" }]; this.dirty.add("accounts"); this.flush(); }
  },
  touch(...names) { names.forEach(n => this.dirty.add(n)); clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 250); render(); },
  serialize(arr) { return "[\n" + arr.map(x => JSON.stringify(x)).join(",\n") + "\n]\n"; },
  async write(dir, name, text) { const fh = await dir.getFileHandle(name, { create: true }); const w = await fh.createWritable(); await w.write(text); await w.close(); },
  async flush() {
    const names = [...this.dirty]; this.dirty.clear();
    try {
      if (this.mode === "dir") { await this.dailyBackup(); for (const n of names) await this.write(this.dir, n + ".json", this.serialize(DB[n])); }
      else if (this.mode === "local") localStorage.setItem("tmb-db", JSON.stringify(DB));
      this.error = null; this.lastSaved = new Date();
    } catch (e) { this.error = e.message; names.forEach(n => this.dirty.add(n)); }
    updateStatus();
  },
  // Einmal pro Tag vor dem ersten Schreiben: Kopie aller Dateien nach backups/JJJJ-MM-TT, die letzten 30 bleiben
  async dailyBackup(force) {
    const day = todayStr(); if (!force && this.backedUp === day) return; this.backedUp = day;
    const root = await this.dir.getDirectoryHandle("backups", { create: true });
    if (!force) { try { await root.getDirectoryHandle(day); return; } catch { } }
    const d = await root.getDirectoryHandle(day, { create: true });
    for (const f of FILES) if (DB[f].length || force) await this.write(d, f + ".json", this.serialize(DB[f]));
    const days = []; for await (const [n, h] of root.entries()) if (h.kind === "directory") days.push(n);
    days.sort(); for (const old of days.slice(0, Math.max(0, days.length - 30))) await root.removeEntry(old, { recursive: true });
  },
};

/* ============================ Zustand & Fachlogik ============================ */
const S = Object.assign({ view: "overview", account: "weighted", rmode: "months", months: 12, year: String(new Date().getFullYear()), from: "", to: "", inclInv: false, inclDepot: false,
  search: "", cat: "", tag: "", type: "all", bview: "month", bsort: "name", catView: "month", cats: [], rcat: "all", hunit: "pct", fixmode: "all", atag: "", tsort: "usage", limit: 100 },
  (() => { try { return JSON.parse(localStorage.getItem("tmb-ui") || "{}"); } catch { return {}; } })());
const saveUI = () => { try { localStorage.setItem("tmb-ui", JSON.stringify(S)); } catch { } };
const cat = id => DB.categories.find(c => c.id === id);
const acc = id => DB.accounts.find(a => a.id === id);
const tagName = id => DB.tags.find(t => t.id === id)?.name;
const catByName = n => DB.categories.find(c => c.name === n);
const isIncome = t => cat(t.category_id)?.name === "Einnahmen";
// Fixkosten = Buchungen aus "Wiederkehrend" oder aus Kategorien mit Haken "Fixkosten"
const isFix = t => t.recurring_id != null || !!cat(t.category_id)?.fixed;
const fixOk = t => S.fixmode === "var" ? !isFix(t) : S.fixmode === "fix" ? isFix(t) : true;
const isExcluded = t => { const n = cat(t.category_id)?.name; return (n === "Investieren" && !S.inclInv) || (n === "Depot" && !S.inclDepot); };
const TAG_SUFFIX = /\s*\|\s*#.*$/;
const baseDesc = d => d.replace(TAG_SUFFIX, "").trim();
const withTags = (d, names) => baseDesc(d) + (names.length ? " | " + names.map(n => "#" + n).join(" ") : "");

function weightOf(t) {
  const rules = DB.account_weights.filter(r => r.account_id === t.account_id && (r.category_id == null || r.category_id === t.category_id)
    && (!r.start_date || r.start_date <= t.date) && (!r.end_date || r.end_date >= t.date));
  if (!rules.length) return 1;
  rules.sort((a, b) => (b.category_id != null) - (a.category_id != null) || (b.start_date || "").localeCompare(a.start_date || ""));
  return Number(rules[0].weight);
}
// Betrag gemäß Kontofilter (gewichtet / alle / ein Konto); null = gehört nicht zum Filter
function amt(t) {
  if (S.account === "weighted") return t.amount * weightOf(t);
  if (S.account === "all") return t.amount;
  return t.account_id === Number(S.account) ? t.amount : null;
}

    rows.sort((a, b) => b.y - a.y);
    for (const r of rows) {
      r.items.sort((a, b) => a.x - b.x); let line = "", end = null;

    }
  }

  if (!text.trim()) throw new Error("Das PDF enthält keinen Text (vermutlich ein Scan). Fotos und Scans kann diese Version nicht lesen.");

const nextTxId = () => Math.max(nextId(DB.transactions), nextId(DB.trash));
function trashTx(ids) {

  toast(moved.length === 1 ? "In den Papierkorb verschoben" : `${moved.length} in den Papierkorb verschoben`, { label: "Rückgängig", fn: () => restoreTx(moved.map(t => t.id)) });
}
function restoreTx(ids) {
  const set = new Set(ids), back = DB.trash.filter(t => set.has(t.id));

  back.forEach(({ deleted_at, ...t }) => {

function mountTagInput(box, state, getSuggestions, getCat) {
  function draw(focus) {
    const c = getCat(), sug = getSuggestions().filter(n => !state.tags.includes(n)).slice(0, 8);
    box.innerHTML = `<div class="tagrow" style="${hueStyle(c)}">${state.tags.map(t => `<span class="tagc big">#${esc(t)}<button type="button" data-rm="${esc(t)}">${ic("x", 12, 2.4)}</button></span>`).join("")}<input type="text" placeholder="Tag hinzufügen…" list="alltags"></div>
    ${sug.length ? `<div class="tagrow" style="margin-top:10px;${hueStyle(c)}">${sug.map(n => `<button type="button" class="tagc sug" data-add="${esc(n)}">+ #${esc(n)}</button>`).join("")}</div>` : ""}`;
    if (focus) $("input", box).focus();
  }
  const add = (n, focus = true) => { n = n.trim().replace(/^#/, ""); if (n && !state.tags.some(t => t.toLowerCase() === n.toLowerCase())) state.tags.push(n); draw(focus); };
  box.onclick = e => { const rm = e.target.closest("[data-rm]"), ad = e.target.closest("[data-add]"); if (rm) { state.tags = state.tags.filter(t => t !== rm.dataset.rm); draw(true); } else if (ad) add(ad.dataset.add); };
  box.onkeydown = e => { if (e.target.tagName !== "INPUT") return; if (e.key === "Enter" || e.key === ",") { e.preventDefault(); add(e.target.value); } else if (e.key === "Backspace" && !e.target.value && state.tags.length) { state.tags.pop(); draw(true); } };
  box.addEventListener("focusout", e => { if (e.target.tagName === "INPUT" && e.target.value.trim()) add(e.target.value, false); });
  box.redraw = () => draw(false); draw(false);
}

const itemLabel = i => i.quantity > 1 ? `${i.quantity}x ${i.name}` : i.name;
// Eine Buchung je Kategorie, Pfand/Leergut getrennt (Tag "Pfand"), Zuordnung wird für künftige Belege gelernt
function confirmReceipt(p) {
  const groups = new Map();
  for (const it of p.items) { const k = `${it.category_id}|${isDeposit(it.name)}`; (groups.get(k) || groups.set(k, []).get(k)).push(it); }
  const shop = resolveTags(p.tags), dep = resolveTags(["Pfand"]);
  const rows = [];
  for (const [k, items] of groups) {
    const [cid, d] = k.split("|"), deposit = d === "true", c = cat(Number(cid)), total = r2(sum(items.map(i => i.amount)));
    if (total === 0) continue;
    const tg = deposit ? dep : shop;
    let desc = deposit ? c.name : `${p.merchant} Einkauf`;
    if (!deposit && c.name !== "Lebensmittel") { desc += ": " + items.map(itemLabel).join(", "); if (desc.length > 120) desc = desc.slice(0, 117).replace(/[ ,]+$/, "") + "..."; }
    rows.push({ date: p.date, description: withTags(desc, tg.map(x => x.name)), amount: -total, note: items.map(i => `${itemLabel(i)}: ${fmtNum(i.amount)}`).join("\n"), category_id: Number(cid), account_id: p.account_id, recurring_id: null, tag_ids: tg.map(x => x.id) });
  }
  // Mit Bankbuchung: die größte Gruppe übernimmt die Bankbuchung, die übrigen hängen als Teilbuchungen daran
  const tx = p.link?.tx;
  if (tx && rows.length) {
    rows.sort((a, b) => a.amount - b.amount);
    const main = rows.shift();
    Object.assign(tx, main, { date: tx.date, account_id: tx.account_id, reviewed: true });
    if (rows.length || Math.abs(main.amount - bankAmt(tx)) > 0.004) tx.split = true;
    rows.forEach(r => { const c = { id: nextTxId(), ...r, date: tx.date, account_id: tx.account_id, split_of: tx.id }; if (tx.status) c.status = tx.status; DB.transactions.push(c); });
  } else rows.forEach(r => DB.transactions.push({ id: nextTxId(), ...r }));
  for (const it of p.items) {
    const key = normName(it.name); if (!key) continue;
    const r = DB.receipt_rules.find(x => x.item_key === key && x.category_id === it.category_id);
    if (r) r.count++; else DB.receipt_rules.push({ id: nextId(DB.receipt_rules), item_key: key, category_id: it.category_id, count: 1 });
  }
  DB.transactions.sort((x, y) => x.date.localeCompare(y.date) || x.id - y.id);
  Store.touch("transactions", "tags", "receipt_rules");
}

  // Spalten sortierbar: Klick = höchste zuerst, nochmal = niedrigste zuerst, dann wieder Ausgangsreihenfolge
  const eurMode = S.hunit === "eur", txt = c => eurMode ? eur0(c.spent) : Math.round(c.pct) + "%";
  const hs = S.hsort, order = mx.rows.map((r, i) => i);

    const val = i => hs.col === "name" ? mx.rows[i].c.name : hs.col === "year" ? mx.yearRows[i]?.[eurMode ? "spent" : "pct"] : mx.rows[i].cells[hs.col]?.[eurMode ? "spent" : "pct"];
    order.sort((a, b) => { const x = val(a), y = val(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return (typeof x === "string" ? x.localeCompare(y) * (hs.dir === "desc" ? -1 : 1) : (x - y) * (hs.dir === "desc" ? -1 : 1)); });
  }

  const upto = months[months.length - 1], hk = (cid, m, b, yr) => ` data-hc="${cid}" data-hm="${m}" data-hb="${b}"${yr ? " data-hy=\"1\"" : ""}`;
  const yc = (y, cid) => y ? `<td style="${col(y.pct)};font-weight:700"${hk(cid, mx.year + "-01:" + upto, y.budget)}>${txt(y)}</td>` : `<td class="faint">·</td>`;
  const row = (name, cells, y, ycells, cid = "", yb = 0) => `<tr><td class="n">${name}</td>${cells.map((c, i) => !c && ycells?.[i] != null ? `<td class="muted" style="${mx.done[i] ? "" : "opacity:.55"}"${ycells[i] ? hk(cid, months[i], yb, 1) : ""}>${ycells[i] ? eur0(ycells[i]) : "·"}</td>` : c ? `<td style="${col(c.pct)};${mx.done[i] ? "" : "opacity:.55"}"${hk(cid, months[i], c.budget)}>${txt(c)}</td>` : `<td class="faint">·</td>`).join("")}<td style="width:10px;padding:0"></td>${yc(y, cid)}</tr>`;
  return `<div style="overflow:auto"><table class="heat"><thead><tr>${th("name", "Kategorie", "text-align:left")}${months.map((m, i) => th(i, mShort(m))).join("")}<th></th>${th("year", "Jahr " + mx.year, "font-weight:800")}</tr></thead><tbody>
  ${order.map(i => { const r = mx.rows[i]; return (r.cells.some(Boolean) || r.ycells.some(v => v != null) || mx.yearRows[i]) ? row(`<span style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:${colorOf(r.c)}"></span>${esc(r.c.name)}${r.cells.some(Boolean) ? "" : ' <span class="faint" style="font-size:11px">Jahresbudget</span>'}`, r.cells, mx.yearRows[i], r.ycells, r.c.id, mx.yearRows[i]?.budget || 0) : ""; }).join("")}${row("<b>Gesamt</b>", mx.total, mx.yearTotal)}</tbody></table></div><p class="faint" style="font-size:12px;margin-top:8px">Blasser Monat = laufend. Monate vor dem Start eines Kontos bleiben leer. Kategorien mit reinem Jahresbudget zeigen den Monatsverbrauch in €. „Jahr“ = Verbrauch seit Januar im Verhältnis zum ganzen Jahresbudget; Monatsbudgets zählen nur für die Monate, in denen das Konto existierte.</p>`;

function rateChart(months, rates) {

  ${rates.map((v, i) => v == null ? "" : `<rect x="${p.l + i * bw + bw * .2}" y="${Math.min(Y(v), Y(0))}" width="${bw * .6}" height="${Math.abs(Y(v) - Y(0))}" fill="${v >= 0 ? "var(--positive)" : "var(--negative)"}" rx="2"><title>${mShort(months[i])}: ${Math.round(v)} %</title></rect>`).join("")}
  ${months.map((m, i) => months.length > 14 && i % 2 ? "" : `<text x="${p.l + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${MON[parseM(m).m - 1]}</text>`).join("")}</svg>`;

PAGES.analytics = function () {

    ${fchip("inclinv", S.inclInv, "Investieren " + (S.inclInv ? "eingeblendet" : "ausgeblendet"))}${fchip("incldepot", S.inclDepot, "Depot " + (S.inclDepot ? "eingeblendet" : "ausgeblendet"))}<span class="faint" style="font-size:12.5px;margin-left:8px">Kosten:</span>${segHtml("fixmode", S.fixmode, [["all", "Alle"], ["var", "Variabel"], ["fix", "Fix"]])}</div>
  <div class="cards compact">${card("up", "", "Einnahmen", eur0(inc), `${months.length} Monate`, "pos")}${card("down", "", "Ausgaben", eur0(exp), `${months.length} Monate`, "neg")}${card("chart", "", "Sparquote", inc ? Math.round((inc - exp) / inc * 100) + " %" : "–", "(Einnahmen − Ausgaben) / Einnahmen")}

/* ============================ Ausgabe-Rhythmus ============================ */
// Ø kumulierte Ausgaben je Tag im Monat über die letzten n abgeschlossenen Monate (ungewichtet, wie die Budgets).
// Damit lässt sich ein Budget nach dem echten Rhythmus (Miete am 1., Einkäufe verteilt) statt linear auf die Tage verteilen.
function dayProfile(accIds, catIds, first, n = 3, pred = null) {
  const cur = nowM(), ms = [];
  for (let i = 1; i <= n; i++) { const m = addM(cur, -i); if (accIds.some(a => first[a] && first[a] <= m)) ms.push(m); }
  if (!ms.length) return null;
  const cs = new Set(catIds), as = new Set(accIds), mset = new Set(ms), per = {};
  ms.forEach(m => per[m] = new Array(32).fill(0));
  for (const t of DB.transactions) {
    const m = t.date.slice(0, 7); if (!mset.has(m) || !as.has(t.account_id) || !cs.has(t.category_id) || isIncome(t) || (pred && !pred(t))) continue;
    per[m][Number(t.date.slice(8, 10))] -= t.amount;
  }
  const cum = new Array(32).fill(0);
  for (const m of ms) { let run = 0; for (let d = 1; d <= 31; d++) { run += per[m][d]; cum[d] += run / ms.length; } }
  return { cum, total: cum[31], months: ms.length };
}
const profShare = (p, d, dm) => p && p.total > 0 ? p.cum[Math.min(d, 31)] / p.total : d / dm;
function rhythmPanel(first) {
  const ids = accountsInFilter(), cur = nowM(), today = new Date().getDate(), dm = dim(cur), td = todayStr(), mode = S.fixmode;
  const bcats = [...new Set(DB.budgets.filter(b => ids.includes(b.account_id)).map(b => b.category_id))].map(cat).filter(Boolean);
  if (!bcats.length) return "";
  const one = S.rcat !== "all" && bcats.some(c => c.id === S.rcat), sel = one ? [S.rcat] : bcats.map(c => c.id);
  const chips = fchip("rcat", !one, "Alle Budgets", 'data-v="all"') + bcats.map(c => fchip("rcat", one && S.rcat === c.id, esc(c.name), `data-v="${c.id}"`)).join("");
  const modeTxt = mode === "var" ? "nur variable Kosten (ohne Wiederkehrende/Fixkosten)" : mode === "fix" ? "nur Fixkosten (Wiederkehrende)" : "alle Kosten";
  const head2 = `<div class="panel"><div class="ph" style="margin-bottom:4px"><div><h2>Ausgabe-Rhythmus im Monat</h2><p class="sub" style="margin:0">Wann im Monat fällt das Geld an? Ø der letzten 3 abgeschlossenen Monate · ${modeTxt}</p></div>${segHtml("fixmode", mode, [["all", "Alle"], ["var", "Variabel"], ["fix", "Fix"]])}</div><div class="fchips">${chips}</div>`;
  const prof = dayProfile(ids, sel, first, 3, fixOk);
  if (!prof || !(prof.total > 0)) return head2 + `<p class="empty">Keine passenden Ausgaben in den letzten Monaten.</p></div>`;
  // Budget gilt für die ganze Kategorie: bei "Variabel" ziehen wir die Ø-Fixkosten ab, bei "Fix" gibt es kein eigenes Budget
  let budget = sum(DB.budgets.filter(b => ids.includes(b.account_id) && sel.includes(b.category_id) && first[b.account_id] && first[b.account_id] <= cur).map(b => b.period === "yearly" ? b.amount / 12 : b.amount));
  const fixAvg = mode === "var" ? (dayProfile(ids, sel, first, 3, isFix)?.total || 0) : 0;
  if (mode === "var") budget = Math.max(0, budget - fixAvg); else if (mode === "fix") budget = 0;
  const act = new Array(32).fill(0), cs = new Set(sel), as = new Set(ids);
  for (const t of DB.transactions) { if (t.date.slice(0, 7) !== cur || t.date > td || !as.has(t.account_id) || !cs.has(t.category_id) || isIncome(t) || !fixOk(t)) continue; act[Number(t.date.slice(8, 10))] -= t.amount; }
  for (let d = 1; d < 32; d++) act[d] += act[d - 1];
  const at = d => prof.cum[Math.min(d, 31)];
  const spentNow = act[today], soll = budget * profShare(prof, today, dm), lin = budget * today / dm;
  const projEnd = spentNow + prof.total - at(today), diff = spentNow - soll;
  const half = (() => { for (let d = 1; d <= dm; d++) if (profShare(prof, d, dm) >= .5) return d; return dm; })();
  const W = 1100, H = 290, p = { l: 62, r: 128, t: 14, b: 26 };
  const max = niceMax(Math.max(budget, prof.total, spentNow, projEnd, 1) * 1.05);
  const X = d => p.l + (W - p.l - p.r) * (d - 1) / (dm - 1), Y = v => p.t + (H - p.t - p.b) * (1 - v / max);
  const path = (fn, a = 1, b = dm) => { let s = ""; for (let d = a; d <= b; d++) s += `${d === a ? "M" : "L"}${X(d)} ${Y(fn(d))} `; return s; };
  // Farben: Blau = dieser Monat, Orange = Budget, Grau = Vergangenheit/Referenz
  const C = { now: "var(--accent)", bud: "var(--warning)", lin: "var(--text-faint)", avg: "var(--text-muted)" };
  const ends = [{ v: projEnd, c: C.now, t: "Prognose " + eur0(projEnd) }, { v: prof.total, c: C.avg, t: "Ø " + eur0(prof.total) }];
  if (budget > 0) ends.push({ v: budget, c: C.bud, t: "Budget " + eur0(budget) });
  ends.forEach(e => e.y = Y(e.v)); ends.sort((a, b) => a.y - b.y); for (let i = 1; i < ends.length; i++) ends[i].y = Math.max(ends[i].y, ends[i - 1].y + 15);
  const xl = [1, 5, 10, 15, 20, 25, dm].map(d => `<text x="${X(d)}" y="${H - 8}" text-anchor="middle">${d}.</text>`).join("");
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%">${axisSVG(W, H, p, max, 4)}
    <line x1="${X(today)}" x2="${X(today)}" y1="${p.t}" y2="${H - p.b}" stroke="var(--text-faint)" stroke-dasharray="2 4" opacity=".6"/><text x="${X(today)}" y="${p.t + 10}" text-anchor="middle" style="fill:var(--text-muted)">heute</text>
    ${budget > 0 ? `<path d="${path(d => budget * d / dm)}" fill="none" stroke="${C.lin}" stroke-width="1.5" stroke-dasharray="5 5"/>` : ""}
    <path d="${path(at)}" fill="none" stroke="${C.avg}" stroke-opacity=".55" stroke-width="1.6"/>
    ${budget > 0 ? `<path d="${path(d => budget * profShare(prof, d, dm))}" fill="none" stroke="${C.bud}" stroke-width="2.6"/>` : ""}
    <path d="${path(d => spentNow + at(d) - at(today), today)}" fill="none" stroke="${C.now}" stroke-width="2.6" stroke-dasharray="2 6" stroke-linecap="round"/>
    <path d="${path(d => act[d], 1, today)}" fill="none" stroke="${C.now}" stroke-width="3.2" stroke-linejoin="round"/>
    <circle cx="${X(today)}" cy="${Y(spentNow)}" r="5" fill="${budget > 0 ? (diff > 0 ? "var(--negative)" : "var(--positive)") : C.now}" stroke="var(--surface)" stroke-width="2"><title>Heute: ${eur(spentNow)}${budget > 0 ? " · Soll nach Rhythmus " + eur(soll) : ""}</title></circle>
    ${ends.map(e => `<text x="${X(dm) + 8}" y="${e.y + 4}" style="fill:${e.c};font-weight:700">${e.t}</text>`).join("")}${xl}</svg>
  <div class="legend"><span><i style="border-color:${C.now};border-top-width:3px"></i>Dieser Monat</span><span><i style="border-color:${C.now};border-top-style:dotted;border-top-width:3px"></i>Prognose</span>${budget > 0 ? `<span><i style="border-color:${C.bud};border-top-width:3px"></i>Budget nach Rhythmus</span><span><i style="border-color:${C.lin};border-top-style:dashed"></i>Budget linear</span>` : ""}<span><i style="border-color:${C.avg}"></i>Ø letzte 3 Monate</span><span class="faint">Punkt grün/rot = unter/über Budget-Soll</span></div>`;
  const budTxt = mode === "var" && fixAvg > 0 ? ` <span class="faint">(Budget abzüglich Ø ${eur0(fixAvg)} Fixkosten)</span>` : "";
  const kpi = budget > 0
    ? `<p class="sub" style="margin:4px 0 8px">Tag ${today}: ausgegeben <b>${eur(spentNow)}</b> · Soll nach Rhythmus <b>${eur(soll)}</b> <span class="faint">(linear wären ${eur(lin)})</span> → <b class="${diff > 0 ? "neg" : "pos"}">${diff > 0 ? eur(diff) + " drüber" : eur(-diff) + " drunter"}</b> · Prognose Monatsende <b class="${projEnd > budget ? "neg" : "pos"}">${eur(projEnd)}</b> von ${eur(budget)}${budTxt}</p>`
    : `<p class="sub" style="margin:4px 0 8px">Tag ${today}: ausgegeben <b>${eur(spentNow)}</b> · Prognose Monatsende <b>${eur(projEnd)}</b> · Ø Monat ${eur(prof.total)}</p>`;
  const rows = bcats.map(c => { const pr = dayProfile(ids, [c.id], first, 3, fixOk); if (!pr || !(pr.total > 0)) return null; let h = dm; for (let d = 1; d <= dm; d++) if (profShare(pr, d, dm) >= .5) { h = d; break; } return { c, total: pr.total, h, s7: profShare(pr, 7, dm) * 100, s15: profShare(pr, 15, dm) * 100 }; }).filter(Boolean).sort((a, b) => b.total - a.total);
  const tbl = `<table style="margin-top:10px"><thead><tr><th>Kategorie</th><th class="num">Ø Monat</th><th class="num">Bis zum 7.</th><th class="num">Bis zum 15.</th><th class="num">Hälfte erreicht am</th></tr></thead><tbody>${rows.map(r => `<tr><td>${catBadge(r.c)}</td><td class="num">${eur0(r.total)}</td><td class="num">${Math.round(r.s7)} %</td><td class="num">${Math.round(r.s15)} %</td><td class="num">${r.h}.</td></tr>`).join("")}</tbody></table>`;
  return head2 + kpi + svg + `<p class="sub" style="margin:8px 0 0">Die Hälfte der Ausgaben ist typischerweise bis zum <b>${half}.</b> erreicht (linear wäre der ${Math.ceil(dm / 2)}.).</p>${tbl}</div>`;
}

/* ============================ Depot ============================ */
// Modell: Kategorie "Depot" = Vermögensseite. Einzahlungen sind normale Buchungen, Rendite sind Buchungen mit "Rendite" in der
// Beschreibung. Wert zum Stichtag eintragen -> die Differenz zum bisherigen Stand wird als Rendite-Buchung angelegt.
const isRendite = t => /rendite/i.test(t.description);
function depotCalc() {
  const c = catByName("Depot"); if (!c) return null;
  const today = todayStr(), all = DB.transactions.filter(t => t.category_id === c.id).sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id), tx = all.filter(t => t.date <= today);
  const snaps = [...DB.depot_values].sort((a, b) => a.date.localeCompare(b.date)), last = snaps[snaps.length - 1];
  const upTo = (d, fn = () => true) => sum(all.filter(t => t.date <= d && fn(t)).map(t => t.amount));
  const deposits = upTo(today, t => !isRendite(t)), value = last ? last.value + sum(all.filter(t => t.date > last.date && t.date <= today).map(t => t.amount)) : upTo(today);
  const year = today.slice(0, 4), yret = sum(tx.filter(t => isRendite(t) && t.date.startsWith(year)).map(t => t.amount));
  return { c, all, tx, snaps, last, upTo, deposits, value, ret: value - deposits, pct: deposits ? (value - deposits) / deposits * 100 : 0, yret, today };
}

}

  const endOf = m => (m === nowM() ? today : m + "-31");
  const val = months.map(m => r2(upTo(endOf(m)))), dep = months.map(m => r2(upTo(endOf(m), t => !isRendite(t))));

function depotChart(months, val, dep, snaps) {
  if (months.length < 2) return '<p class="empty">Zu wenig Daten.</p>';
  const W = 1100, H = 280, p = { l: 62, r: 14, t: 14, b: 26 }, max = niceMax(Math.max(...val, ...dep, 1) * 1.04), bw = (W - p.l - p.r) / (months.length - 1);
  const X = i => p.l + bw * i, Y = v => p.t + (H - p.t - p.b) * (1 - v / max), path = a => a.map((v, i) => (i ? "L" : "M") + X(i) + " " + Y(v)).join(" ");
  const area = "M" + X(0) + " " + Y(dep[0]) + " " + dep.map((v, i) => "L" + X(i) + " " + Y(v)).join(" ") + " " + val.map((v, i) => "L" + X(val.length - 1 - i) + " " + Y(val[val.length - 1 - i])).join(" ") + "Z";
  const dots = snaps.map(s => { const i = months.indexOf(s.date.slice(0, 7)); return i < 0 ? "" : '<circle cx="' + X(i) + '" cy="' + Y(s.value) + '" r="4.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"><title>' + dFmt(s.date) + ": " + eur(s.value) + "</title></circle>"; }).join("");
  const lbl = months.map((m, i) => (months.length > 18 ? parseM(m).m % 6 === 1 : months.length > 10 ? i % 2 === 0 : true) ? '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + mShort(m) + "</text>" : "").join("");
  return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%">' + axisSVG(W, H, p, max, 4) + '<path d="' + area + '" fill="var(--positive)" opacity=".12"/><path d="' + path(dep) + '" fill="none" stroke="var(--rigid)" stroke-width="2.5"/><path d="' + path(val) + '" fill="none" stroke="var(--positive)" stroke-width="2.5" stroke-linejoin="round"/>' + dots + lbl + "</svg>"
    + '<div class="legend"><span><i style="border-color:var(--positive)"></i>Wert des Depots</span><span><i style="border-color:var(--rigid)"></i>Eingezahlt</span><span><i style="border-color:var(--accent);border-top-style:dotted"></i>Eingetragener Stand (Kreis)</span></div>';
}
function depotDialog() {
  const D = depotCalc(); if (!D) return;

  openDialog('<form class="dlg" id="df"><h2>Depotwert eintragen</h2><p class="sub" style="margin:0">Gib den Wert deines Depots an einem Stichtag ein. Die Rendite wird aus der Differenz zum letzten Stand und den Einzahlungen dazwischen berechnet.</p>'
    + '<div class="row2"><div class="field"><label>Stichtag</label><input type="date" name="date" value="' + todayStr() + '" required></div><div class="field"><label>Depotwert (€)</label><input class="amount" name="value" inputmode="decimal" placeholder="0,00" required></div></div>'

  });
}
function removeDepotValue(s) {
  DB.depot_values = DB.depot_values.filter(x => x !== s);
  if (s.tx_id != null) DB.transactions = DB.transactions.filter(t => t.id !== s.tx_id);
}
function saveDepotValue(date, V, book) {
  const old = DB.depot_values.find(s => s.date === date); if (old) removeDepotValue(old);
  const c = catByName("Depot"); let tx_id = null;
  if (book && c) {
    const adj = r2(V - sum(DB.transactions.filter(t => t.category_id === c.id && t.date <= date).map(t => t.amount)));
    if (Math.abs(adj) >= 0.005) {
      const last = DB.transactions.filter(t => t.category_id === c.id).sort((a, b) => b.date.localeCompare(a.date))[0], tagId = last?.tag_ids?.[0];
      const names = tagId ? [tagName(tagId)].filter(Boolean) : [], tg = resolveTags(names), cnt = {}; DB.transactions.filter(t => t.category_id === c.id).forEach(t => cnt[t.account_id] = (cnt[t.account_id] || 0) + 1);
      const accId = Number(Object.entries(cnt).sort((a, b) => b[1] - a[1])[0]?.[0]) || DB.accounts[0].id;
      tx_id = nextTxId();
      DB.transactions.push({ id: tx_id, date, description: withTags("Depot Rendite", tg.map(x => x.name)), amount: adj, note: "Depotwert zum Stichtag: " + eur(V), category_id: c.id, account_id: accId, recurring_id: null, tag_ids: tg.map(x => x.id) });
      DB.transactions.sort((x, y) => x.date.localeCompare(y.date) || x.id - y.id);
    }
  }
  DB.depot_values.push({ id: nextId(DB.depot_values), date, value: V, tx_id });
  Store.touch("depot_values", "transactions", "tags"); toast("Depotwert gespeichert");
}

PAGES.yearly = function () {
  const ys = [...new Set([...DB.transactions.map(t => Number(t.date.slice(0, 4))), new Date().getFullYear()])].sort(), tab = {};
  for (const t of DB.transactions) { if (isExcluded(t)) continue; const a = amt(t); if (a == null) continue; const k = t.category_id + "|" + t.date.slice(0, 4); tab[k] = (tab[k] || 0) + a; }
  const inc = c => c.name === "Einnahmen" ? 1 : 0;
  const rows = DB.categories.map(c => ({ c, vals: ys.map(y => tab[c.id + "|" + y] ?? null) })).filter(r => r.vals.some(v => v != null)).sort((a, b) => (inc(b.c) - inc(a.c)) || sum(a.vals.map(v => v || 0)) - sum(b.vals.map(v => v || 0)));
  const colour = (r, v) => { if (v == null) return ""; const vs = r.vals.filter(x => x != null).map(Math.abs), lo = Math.min(...vs), hi = Math.max(...vs), t = hi === lo ? .5 : (Math.abs(v) - lo) / (hi - lo), good = v > 0 ? t : 1 - t; return `background:color-mix(in oklab,${good > .5 ? "var(--positive)" : "var(--negative)"} ${Math.round(Math.abs(good - .5) * 70)}%,transparent)`; };
  return head("Jahresverlauf", "Kategorien im Vergleich über die Jahre") + `<div class="panel" style="padding:10px 14px"><table class="yv"><thead><tr><th>Kategorie</th>${ys.map(y => `<th class="num">${y}</th>`).join("")}</tr></thead><tbody>
  ${rows.map(r => `<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:${colorOf(r.c)}"></span>${esc(r.c.name)}</td>${r.vals.map(v => `<td style="${colour(r, v)}">${v == null ? '<span class="faint">–</span>' : seur(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
};

    <p style="display:flex;gap:8px;flex-wrap:wrap">${Store.supported ? `<button class="btn" data-act="pick">Anderen Ordner wählen</button>` : ""}${Store.mode === "dir" ? `<button class="btn" data-act="backupnow">Jetzt sichern</button>` : ""}
    <button class="btn" data-act="export">Alles exportieren</button><button class="btn" data-act="import">Importieren …</button></p><input type="file" id="importFile" accept=".json" hidden>
    <p class="faint" style="font-size:12.5px;margin-top:14px">${DB.transactions.length} Buchungen · ${DB.categories.length} Kategorien · ${DB.tags.length} Tags · ${DB.budgets.length} Budgets</p></div></div></div>`;
};

/* ============================ Bank-Import (Sammler -> bank_inbox.json) ============================ */
// Quelle der Wahrheit ist die ING: der Sammler (tracker/collector) legt gebuchte und vorgemerkte Umsätze in bank_inbox.json ab.
// Hier wird abgeglichen: schon verknüpft -> aktualisieren, vorgemerkt -> gebucht, von Hand erfasst -> verknüpfen,
// Wiederkehrend -> automatisch buchen, bekannte Gegenseite (Regel) -> automatisch buchen, sonst -> "Neue Umsätze".
const Inbox = { data: null, mtime: 0, queue: [], orphans: [], receipts: [] };
const ackHas = (id, kind) => DB.bank_ack.some(a => a.id === id && a.kind === kind);
const ackAdd = (id, kind) => { if (!ackHas(id, kind)) DB.bank_ack.push({ id, kind, at: todayStr() }); };
const bankSince = () => DB.bank_ack.find(a => a.kind === "since")?.id || "";
const accByName = n => DB.accounts.find(a => a.name === n);
const dayDiff = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);
const nearDate = (a, b, n) => Math.abs(dayDiff(a, b)) <= n;
const normKey = s => s.toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/[^a-z]/g, "");
const bankAmt = t => t.bank?.amount ?? t.amount;
const GENERIC_KEYS = new Set(["paypal", "amazon", "amzn"]);

async function loadInbox(force) {
  if (Store.mode !== "dir") return;
  try {
    const f = await (await Store.dir.getFileHandle("bank_inbox.json")).getFile();
    if (!force && f.lastModified === Inbox.mtime) return;
    Inbox.mtime = f.lastModified; Inbox.data = JSON.parse(await f.text());
  } catch (e) { if (e.name !== "NotFoundError") console.warn(e); Inbox.data = null; }
  processInbox(); render();
}
function bankDesc(v) { return v.key?.startsWith("iban:") && v.counterparty ? v.counterparty : v.merchant || v.counterparty || "Umsatz"; }
function createFromBank(v, spec, auto) {
  const tg = (spec.tag_ids || []).map(tagName).filter(Boolean), accId = accByName(v.account).id;
  const t = { id: nextTxId(), date: v.date, description: withTags(spec.description || bankDesc(v), tg), amount: v.amount, note: null, category_id: spec.category_id, account_id: accId,
    recurring_id: spec.recurring_id ?? null, tag_ids: [...(spec.tag_ids || [])], ext_id: v.id, bank: { amount: v.amount, merchant: v.merchant, key: v.key, purpose: v.purpose } };
  if (v.status === "pending") t.status = "pending";
  if (auto) t.auto = auto;
  DB.transactions.push(t); DB.transactions.sort((x, y) => x.date.localeCompare(y.date) || x.id - y.id);
  return t;
}
function linkBank(t, v) {
  t.ext_id = v.id; t.bank = { amount: v.amount, merchant: v.merchant, key: v.key, purpose: v.purpose };
  if (v.status === "pending") t.status = "pending"; else delete t.status;
  for (const c of DB.transactions) if (c.split_of === t.id) { if (v.status === "pending") c.status = "pending"; else delete c.status; }
}
function upsertRule(key, spec) {
  if (!key) return;
  const r = DB.bank_rules.find(x => x.key === key);
  if (r) { Object.assign(r, spec); r.count = (r.count || 0) + 1; } else DB.bank_rules.push({ id: nextId(DB.bank_rules), key, ...spec, count: 1 });
}
/* ----- Mails zur Bankbuchung: Amazon über die Bestellnummer im Verwendungszweck, sonst Betrag + Datum ----- */
const orderNo = s => { const m = (s || "").match(/\b(\d{3})[.\-](\d{7})[.\-](\d{7})\b/); return m ? `${m[1]}-${m[2]}-${m[3]}` : null; };
const itemsSum = items => r2(sum(items.map(i => (i.price || 0) * (i.qty || 1))));
// Amazon-Titel sind lang ("Bunte Socken Damen, Baumwolle, 6 Paar …"): bis zum ersten Komma/Strich, höchstens 6 Wörter
const shortItem = n => n.split(/\s*[|,–]\s+|\s+-\s+/)[0].split(/\s+/).slice(0, 6).join(" ");
const sameAmt = (a, b) => Math.abs(Math.abs(a) - Math.abs(b)) < 0.005;
// Amazon bucht Bestellungen mit mehreren Liefertagen oft getrennt ab: dann passt eine Lieferung statt der Summe
function amazonPart(o, amount) {
  if (sameAmt(o.total, amount)) return o.shipments.flat();
  return o.shipments.find(s => sameAmt(itemsSum(s), amount)) || null;
}
function mailInfo(it) {
  const m = Inbox.data?.mail; if (!m || !it || !it.amount) return null;
  const no = orderNo(it.purpose);
  const o = (m.orders || []).find(o => no && o.order === no) || (m.orders || []).find(o => amazonPart(o, it.amount) && dayDiff(o.date, it.date) >= -2 && dayDiff(o.date, it.date) <= 21);
  if (o) {
    const items = amazonPart(o, it.amount) || o.shipments.flat();
    return { kind: "amazon", id: o.id, order: o.order, items, label: "Amazon " + o.order, text: items.map(i => `${i.qty > 1 ? i.qty + "× " : ""}${shortItem(i.name)} ${fmtNum((i.price || 0) * (i.qty || 1))}`).join(" · ") };
  }
  const ml = (m.mails || []).filter(x => !ackHas(x.id, "mail_done") && dayDiff(x.date, it.date) >= -3 && dayDiff(x.date, it.date) <= 14 && (sameAmt(x.total, it.amount) || (x.amounts || []).some(a => sameAmt(a, it.amount))))
    .sort((a, b) => (sameAmt(b.total, it.amount) - sameAmt(a.total, it.amount)) || (b.total_sure - a.total_sure) || Math.abs(dayDiff(a.date, it.date)) - Math.abs(dayDiff(b.date, it.date)))[0];
  return ml ? { kind: "mail", id: ml.id, label: ml.merchant, text: ml.subject } : null;
}
// Bestellungen, Rechnungen und PayPal-Zahlungen, zu denen die ING noch nichts gebucht hat
function waitingMail() {
  const m = Inbox.data?.mail; if (!m) return [];
  const bank = Inbox.data.items || [], since = bankSince(), from = (() => { const x = new Date(); x.setDate(x.getDate() - 21); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; })();
  const fresh = x => x.date >= from && (!since || x.date >= since) && !ackHas(x.id, "mail_done");
  const hit = (amt, date) => bank.some(b => sameAmt(b.amount, amt) && dayDiff(date, b.date) >= -3 && dayDiff(date, b.date) <= 21);
  const out = [];
  for (const o of (m.orders || []).filter(fresh)) {
    const paid = bank.filter(b => orderNo(b.purpose) === o.order);
    if (paid.some(b => sameAmt(b.amount, o.total)) || hit(o.total, o.date)) continue;
    const open = o.shipments.filter(s => !paid.some(b => sameAmt(b.amount, itemsSum(s))) && !hit(itemsSum(s), o.date));
    if (!open.length) continue;
    const items = open.flat();
    out.push({ id: o.id, date: o.date, kind: "Amazon", title: "Amazon-Bestellung " + o.order, amount: open.length === o.shipments.length ? -Math.abs(o.total) : -itemsSum(items), text: items.map(i => shortItem(i.name)).join(" · ") });
  }
  for (const p of (m.paypal || []).filter(p => fresh(p) && p.amount < 0)) if (!hit(p.amount, p.date)) out.push({ id: p.id, date: p.date, kind: "PayPal", title: p.merchant, amount: p.amount, text: "PayPal-Zahlung" });
  const seen = new Set();
  for (const x of (m.mails || []).filter(x => fresh(x) && x.total_sure && x.total > 0)) {
    const k = Math.round(x.total * 100); if (seen.has(k) || out.some(o => sameAmt(o.amount, x.total))) continue; seen.add(k);
    if (!hit(x.total, x.date)) out.push({ id: x.id, date: x.date, kind: "Mail", title: x.merchant, amount: -x.total, text: x.subject });
  }
  return out.sort((a, b) => b.date.localeCompare(a.date));
}
// PayPal: der echte Händler steht in der PayPal-Mail, nicht im Kontoauszug
function enrich(it) {
  const v = { ...it }, info = mailInfo(it);
  if (info) v.info = info;
  if (it.key === "paypal") {
    const pp = (Inbox.data?.mail?.paypal || []).find(p => Math.abs(p.amount - it.amount) < 0.005 && nearDate(p.date, it.date, 5) && (!ackHas(p.id, "paypal_used") || DB.bank_ack.some(a => a.id === p.id && a.kind === "paypal_used" && a.for === it.id)));
    if (pp) { v.merchant = pp.merchant; v.key = "pp:" + normKey(pp.merchant); v.paypal = pp.id; }
  }
  return v;
}
function processInbox() {
  const d = Inbox.data; Inbox.queue = []; Inbox.orphans = []; Inbox.receipts = [];
  if (!d) return;
  Inbox.receipts = (d.mail?.receipts || []).filter(r => !ackHas(r.id, "receipt_done"));
  const back2 = DB.bank_ack.filter(a => a.kind === "receipt_restore" && Inbox.receipts.some(r => r.id === a.id));
  if (back2.length) { DB.bank_ack = DB.bank_ack.filter(a => !back2.includes(a)); Store.dirty.add("bank_ack"); }
  const back = DB.transactions.filter(t => t.auto === "rule" && t.bank && GENERIC_KEYS.has(t.bank.key) && !t.split);
  if (back.length) { DB.transactions = DB.transactions.filter(t => !back.includes(t)); Store.dirty.add("transactions"); }
  // ältere Verknüpfungen ohne Herkunft nachtragen: Beschreibung = Bankname -> von dir per Kategorie zugeordnet
  for (const t of DB.transactions) if (t.ext_id && !t.auto && !t.via && t.bank) t.via = baseDesc(t.description) === t.bank.merchant ? "chosen" : "link";
  const since = bankSince(); if (!since) return;
  let changed = false;
  const items = (d.items || []).filter(it => accByName(it.account) && it.date >= since && !ackHas(it.id, "ignored"))
    .sort((a, b) => a.date.localeCompare(b.date) || (a.status === "booked" ? -1 : 1));
  const ids = new Set((d.items || []).map(i => i.id)), byExt = new Map(DB.transactions.filter(t => t.ext_id).map(t => [t.ext_id, t]));
  for (const it of items) {
    const accId = accByName(it.account).id;
    let t = byExt.get(it.id);
    if (t) { if (Math.abs(bankAmt(t) - it.amount) > 0.004) { if (!t.split) t.amount = it.amount; t.bank.amount = it.amount; changed = true; } continue; }
    const cands = DB.transactions.filter(x => x.status === "pending" && x.account_id === accId && x.ext_id && nearDate(x.date, it.date, 4));
    // weiterhin vorgemerkt, aber mit neuer Kennung (die ING verschiebt z. B. das voraussichtliche Buchungsdatum): wieder verknüpfen
    if (it.status === "pending") {
      t = cands.find(x => !ids.has(x.ext_id) && Math.abs(bankAmt(x) - it.amount) < 0.005 && (x.bank?.key === it.key || !x.bank?.key));
      if (t) { byExt.delete(t.ext_id); linkBank(t, it); byExt.set(it.id, t); changed = true; continue; }
    }
    if (it.status === "booked") {
      t = cands.find(x => Math.abs(bankAmt(x) - it.amount) < 0.005)
        || cands.find(x => !ids.has(x.ext_id) && Math.sign(bankAmt(x)) === Math.sign(it.amount) && Math.abs(bankAmt(x) - it.amount) <= Math.abs(it.amount) * .2 && (x.bank?.key === it.key || !x.bank?.key));
      if (t) { byExt.delete(t.ext_id); linkBank(t, it); if (!t.split) t.amount = it.amount; t.date = it.date; byExt.set(it.id, t); changed = true; continue; }
    }
    // von Hand erfasst (z. B. vor dem Stichtag oder direkt nach dem Einkauf)
    // Vorgebuchte Wiederkehrende (z. B. Handyrechnung geplant am 10., abgebucht am 16.) dürfen weiter auseinanderliegen
    t = DB.transactions.filter(x => !x.ext_id && !x.split_of && x.account_id === accId && Math.abs(x.amount - it.amount) < 0.005 && nearDate(x.date, it.date, x.recurring_id ? 10 : 3))
      .sort((a, b) => Math.abs(dayDiff(a.date, it.date)) - Math.abs(dayDiff(b.date, it.date)))[0];
    if (t) {
      linkBank(t, it); t.via = "link"; byExt.set(it.id, t); changed = true;
      // aus deiner eigenen Buchung lernen: Gegenseite -> Kategorie (z. B. Drillisch -> Handyrechnung)
      if (!it.internal && !GENERIC_KEYS.has(it.key) && !DB.bank_rules.some(x => x.key === it.key)) { upsertRule(it.key, { category_id: t.category_id, description: baseDesc(t.description), tag_ids: [...t.tag_ids], ignore: false }); Store.dirty.add("bank_rules"); }
      continue;
    }
    // Wiederkehrend
    const r = DB.recurring.find(r => r.account_id === accId && r.next_due_date && Math.abs(r.amount - it.amount) <= Math.max(0.01, Math.abs(r.amount) * .01) && dayDiff(r.next_due_date, it.date) >= -10 && dayDiff(r.next_due_date, it.date) <= 6);
    if (r) {
      const tx = createFromBank(it, { category_id: r.category_id, description: r.description, tag_ids: r.tag_ids, recurring_id: r.id }, "recurring");
      r.next_due_date = advance(r.next_due_date, r.frequency, 1); byExt.set(it.id, tx); changed = true; continue;
    }
    const v = enrich(it);
    const rule = DB.bank_rules.find(x => x.key === v.key);
    if (rule?.ignore) { ackAdd(it.id, "ignored"); changed = true; continue; }
    if (rule && GENERIC_KEYS.has(v.key)) v.suggest = rule.category_id;
    else if (rule) {
      const tx = createFromBank(v, { category_id: rule.category_id, description: rule.description || bankDesc(v), tag_ids: rule.tag_ids }, "rule");
      if (v.paypal) DB.bank_ack.push({ id: v.paypal, kind: "paypal_used", for: it.id, at: todayStr() });
      byExt.set(it.id, tx); changed = true; continue;
    }
    if (!v.suggest) { const r = DB.bank_rules.find(x => x.key === v.key); if (r && !r.ignore) v.suggest = r.category_id; }
    Inbox.queue.push(v);
  }
  // vorgemerkt, aber die Bank kennt den Umsatz nicht mehr und es kam keine Buchung
  if (d.bank_at && d.status !== "error") Inbox.orphans = DB.transactions.filter(t => t.status === "pending" && t.ext_id && !ids.has(t.ext_id) && dayDiff(t.date, d.bank_at.slice(0, 10)) > 3);
  Inbox.queue.sort((a, b) => b.date.localeCompare(a.date));
  if (changed) Store.touch("transactions", "bank_ack", "recurring");
}

/* ----- Bankbuchung aufteilen: Positionen bis die Summe dem Bankbetrag entspricht (z. B. Einkauf + Pfand-Rückgabe als Einnahme) ----- */
function splitDialog(t) {
  if (!t) return;
  const target = bankAmt(t), kids = DB.transactions.filter(x => x.split_of === t.id);
  const rows = [t, ...kids].map(x => ({ cat: x.category_id, amt: fmtNum(Math.abs(x.amount)), inc: x.amount > 0, desc: x === t && !kids.length ? "" : baseDesc(x.description) }));
  rows[0].auto = !kids.length;
  if (!kids.length) { rows[0].amt = fmtNum(Math.abs(target)); rows[0].inc = target > 0; }
  // Amazon: Artikel aus der Bestellmail als Positionen vorschlagen (erste Position fängt Versand/Rabatt als Rest auf)
  const info = !kids.length && t.bank ? mailInfo({ purpose: t.bank.purpose, amount: target, date: t.date }) : null;
  if (info?.kind === "amazon" && info.items.length > 1) {
    rows.splice(0, 1, ...info.items.map((i, n) => ({ cat: t.category_id, amt: fmtNum((i.price || 0) * (i.qty || 1)), inc: false, desc: (i.qty > 1 ? i.qty + "× " : "") + shortItem(i.name), auto: n === 0 })));
    rows[0].amt = fmtNum(Math.abs(r2(target - sum(rows.slice(1).map(r => -parseAmount(r.amt))))));
  }
  const einn = catByName("Einnahmen");
  openDialog(`<form class="dlg" id="spf"><h2>Buchung aufteilen</h2><p class="sub" style="margin:2px 0 0"><b>${esc(baseDesc(t.description))}</b> · ${dFmt(t.date)} · ${esc(acc(t.account_id)?.name)} · laut Bank <b>${seur(target)}</b></p>
    <p class="sub" style="margin:0">Weitere Positionen eintragen, die erste rechnet sich automatisch als Rest. „+“ steht für Einnahmen, z. B. zurückgegebenes Pfand. Rechnen geht auch (12,50+3).</p>
    <div class="ritems" id="sprows"></div>
    <p style="display:flex;gap:8px"><button type="button" class="btn sm" id="spadd">${ic("plus", 14, 2.2)}Position hinzufügen</button><button type="button" class="btn sm ghost" id="sppfand">${ic("plus", 14, 2.2)}Pfand-Rückgabe (Einnahme)</button></p>
    <div class="rsum" id="spsum"></div>
    <div class="actions"><button type="button" class="btn" data-act="closedlg">Abbrechen</button><button class="btn primary" id="spsave">Speichern</button></div></form>`, true, d => {
    const val = r => { const v = parseAmount(r.amt); return v == null ? 0 : r2(Math.abs(v) * (r.inc ? 1 : -1)); };
    const rest = () => r2(target - sum(rows.map(val)));
    const autoFill = () => { const r0 = rows[0]; if (!r0.auto) return; const v = r2(target - sum(rows.slice(1).map(val))); r0.inc = v > 0; r0.amt = fmtNum(Math.abs(v)); const inp = d.querySelector('#sprows .ri[data-i="0"] [data-k=amt]'); if (inp) { inp.value = r0.amt; const row = inp.closest(".ri"); row.querySelector("[data-k=exp]").classList.toggle("on", !r0.inc); row.querySelector("[data-k=inc]").classList.toggle("on", r0.inc); } };
    const stats = () => {
      const tot = r2(sum(rows.map(val))), rs = rest(), ok = Math.abs(rs) < 0.005;
      $("#spsum", d).className = "rsum " + (ok ? "ok" : "bad");
      $("#spsum", d).innerHTML = `<span>Summe der Positionen: <b>${seur(tot)}</b></span><span>muss sein: <b>${seur(target)}</b></span><span>${ok ? "✓ passt" : `noch offen: <b>${seur(rs)}</b>`}</span>`;
      $("#spsave", d).disabled = !ok; $("#spsave", d).textContent = `Speichern (${rows.length} ${rows.length === 1 ? "Buchung" : "Buchungen"})`;
    };
    const draw = () => {
      $("#sprows", d).innerHTML = rows.map((r, i) => `<div class="ri sp" data-i="${i}"><div class="seg"><button type="button" data-k="exp" class="${r.inc ? "" : "on"}" title="Ausgabe">−</button><button type="button" data-k="inc" class="${r.inc ? "on" : ""}" title="Einnahme">+</button></div>
        <input data-k="desc" value="${esc(r.desc)}" placeholder="${i === 0 ? esc(baseDesc(t.description)) : "Beschreibung (optional)"}">
        <select data-k="cat">${DB.categories.map(c => `<option value="${c.id}"${c.id === r.cat ? " selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
        <input data-k="amt" value="${esc(r.amt)}" inputmode="decimal" style="text-align:right" title="${i === 0 && r.auto ? "Rest, rechnet sich automatisch" : ""}" placeholder="0,00"><button type="button" class="btn ghost sm" data-k="del" ${rows.length < 2 ? "disabled" : ""} title="Position entfernen">${ic("x", 14)}</button></div>`).join("");
      stats();
    };
    const add = (inc, desc) => {
      const rs = rest(), fill = !rows[0].auto && Math.abs(rs) >= 0.005;
      rows.push({ cat: inc && einn ? einn.id : rows[0].cat, amt: fill ? fmtNum(Math.abs(rs)) : "", inc: fill ? rs > 0 : !!inc, desc: desc || "" });
      draw(); const ins = d.querySelectorAll("#sprows [data-k=amt]"); ins[ins.length - 1]?.focus(); ins[ins.length - 1]?.select();
    };
    $("#spadd", d).onclick = () => add(false);
    $("#sppfand", d).onclick = () => add(true, "Pfand");
    $("#sprows", d).oninput = e => { const row = e.target.closest(".ri"); if (!row) return; const r = rows[Number(row.dataset.i)], k = e.target.dataset.k; if (k === "amt" || k === "desc") { r[k] = e.target.value; if (k === "amt" && r === rows[0]) r.auto = false; if (k === "amt") autoFill(); stats(); } };
    $("#sprows", d).onchange = e => { const row = e.target.closest(".ri"); if (row && e.target.dataset.k === "cat") rows[Number(row.dataset.i)].cat = Number(e.target.value); };
    $("#sprows", d).onclick = e => {
      const b = e.target.closest("button[data-k]"); if (!b) return; const i = Number(b.closest(".ri").dataset.i), r = rows[i];
      if (b.dataset.k === "del") { rows.splice(i, 1); if (i === 0) rows[0].auto = false; autoFill(); draw(); return; }
      if (i === 0) r.auto = false;
      r.inc = b.dataset.k === "inc"; if (r.inc && einn && i > 0 && r.cat !== einn.id) { r.cat = einn.id; if (!r.desc) r.desc = "Pfand"; } autoFill(); draw();
    };
    draw();
    $("#spf", d).onsubmit = ev => {
      ev.preventDefault(); if (Math.abs(rest()) >= 0.005) return;
      DB.transactions = DB.transactions.filter(x => x.split_of !== t.id);
      const [m, ...more] = rows, tg = t.tag_ids.map(tagName).filter(Boolean);

    const date = draft.date || r.date;
