  if (doneAll.length) body += `<div class="panel"><div class="ph" style="margin:0 0 6px"><div><h2>Übernommen <span class="faint">(${doneAll.length} in 30 Tagen)</span></h2><p class="sub">Alles, was von der ING kam. Eine geänderte Kategorie wird für die Gegenseite gemerkt.</p></div>${segHtml("bsrc", S.bsrc || "all", [["all", "Alle"], ["auto", "Automatisch"], ["me", "Von dir"]])}</div>
    <table><tbody>${done.slice(0, 80).map(t => `<tr><td style="white-space:nowrap">${dFmt(t.date)}</td><td><div class="t-desc">${esc(baseDesc(t.description))}${t.status === "pending" ? ' <span class="pill-p">vorgemerkt</span>' : ""}</div><div class="t-note">${esc(acc(t.account_id)?.name)}${t.bank?.merchant && t.bank.merchant !== baseDesc(t.description) ? " · Bank: " + esc(t.bank.merchant) : ""}</div>${(() => { const mi = t.bank && !t.split && !t.split_of ? mailInfo({ purpose: t.bank.purpose, amount: bankAmt(t), date: t.date }) : null; return mi ? `<div class="t-note minfo">${ic(mi.kind === "amazon" ? "box" : "mail", 12)}${esc(mi.text.slice(0, 160))}</div>` : ""; })()}</td><td><span class="src ${srcOf(t)[0]}">${srcOf(t)[1]}</span></td>
      <td><select data-act="autocat" data-id="${t.id}">${DB.categories.map(c => `<option value="${c.id}"${c.id === t.category_id ? " selected" : ""}>${esc(c.name)}</option>`).join("")}</select></td><td class="num ${t.amount > 0 ? "pos" : "neg"}"><b>${seur(t.amount)}</b></td>
      <td class="num" style="white-space:nowrap">${t.ext_id || t.split_of ? `<button class="btn ghost sm" data-act="splittx" data-id="${t.split_of || t.id}" title="Aufteilen">${ic("split", 15)}</button>` : ""}${(t.auto || t.via === "chosen") && !t.split && !t.split_of ? `<button class="btn ghost sm" data-act="bankundo" data-id="${t.id}" title="Zuordnung aufheben: zurück in Neue Umsätze">${ic("repeat", 15)}</button>` : ""}<button class="btn ghost sm" data-act="edittx" data-id="${t.id}">${ic("edit", 15)}</button></td></tr>`).join("")}</tbody></table></div>`;
  body += goneHtml;
  const todo = Inbox.queue.length + Inbox.receipts.length + Inbox.orphans.length;
  return head("Neue Umsätze", !d ? "Von der ING abgerufen" : todo ? `${todo} ${todo === 1 ? "Eintrag wartet" : "Einträge warten"} auf dich` : "Nichts zu tun", d ? inboxHeadRight() : "") + body;
};

/* ============================ Ereignisse ============================ */
document.addEventListener("click", async e => {
  if (gfOpen && !e.target.closest(".gfi")) { gfOpen = null; render(); }
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (["INPUT", "SELECT"].includes(el.tagName) && el.type !== "checkbox") return;
  if (el.tagName === "INPUT" && !["selall", "selrow"].includes(el.dataset.act)) return;
  if (el.dataset.act === "edittx" && el.classList.contains("it") && e.target.closest("button")) return;
  const a = el.dataset.act, id = Number(el.dataset.id), v = el.dataset.v;
  try {
    switch (a) {
      case "view": S.view = v; S.limit = 100; saveUI(); render(); scrollTo(0, 0); break;
      case "hsort": { const col = v === "name" || v === "year" ? v : Number(v), cur = S.hsort; const first = col === "name" ? "asc" : "desc"; S.hsort = !cur || String(cur.col) !== String(col) ? { col, dir: first } : cur.dir === first ? { col, dir: first === "desc" ? "asc" : "desc" } : null; saveUI(); render(); break; }
      case "adddepot": depotDialog(); break;
      case "bankcat": bookQueued(v, id, true); toast("Gebucht und gemerkt"); break;
      case "bankignore": { const q = Inbox.queue.find(x => x.id === v); ignoreQueued(v, !!q?.internal); toast(q?.internal ? "Umbuchung ignoriert, künftig automatisch" : "Ignoriert"); break; }
      case "bankedit": { const q = Inbox.queue.find(x => x.id === v); if (!q) break; const c = q.amount > 0 ? catByName("Einnahmen") : DB.categories.find(c => !["Einnahmen", "Depot", "Investieren"].includes(c.name)); const tx = bookQueued(v, (c || DB.categories[0]).id, false); if (tx) txDialog(tx); break; }
      case "inboxreceipt": openInboxReceipt(v); break;
      case "receiptdone": { const r = Inbox.receipts.find(x => x.id === v); discard(v, "receipt_done", r ? { title: r.subject || r.file, from: r.from, date: r.date, gm_id: r.gm_id } : {}); closeDialog(); break; }
      case "maildone": { const w = waitingMail().find(x => x.id === v); discard(v, "mail_done", w ? { title: w.title, from: w.kind, date: w.date, amount: w.amount } : {}); break; }
      case "restore": restoreAck(v); toast("Wiederhergestellt"); break;
      case "inboxhelp": inboxHelp(); break;
      case "inboxreload": await loadInbox(true); toast("Neu eingelesen"); break;
      case "banksince": { const val = $("#sinceInp")?.value; if (!val) break; DB.bank_ack = DB.bank_ack.filter(a => a.kind !== "since"); DB.bank_ack.push({ id: val, kind: "since", at: todayStr() }); processInbox(); Store.touch("bank_ack"); break; }
      case "depotaccept": { const dp = Inbox.data?.depot; if (dp) saveDepotValue(dp.date, dp.value, true); break; }
      case "orphankeep": { const t = DB.transactions.find(x => x.id === id); if (t) { delete t.status; delete t.ext_id; Store.touch("transactions"); processInbox(); } break; }
      case "bsrc": S.bsrc = v; saveUI(); render(); break;
      case "splittx": splitDialog(DB.transactions.find(x => x.id === id)); break;
      case "banksplit": { const q = Inbox.queue.find(x => x.id === v); if (!q) break; const c = cat(q.suggest) || (q.amount > 0 ? catByName("Einnahmen") : catByName("Lebensmittel")) || DB.categories[0]; const tx = bookQueued(v, c.id, false); if (tx) splitDialog(tx); break; }
      case "bankundo": { const t = DB.transactions.find(x => x.id === id); if (!t) break; if (t.recurring_id && t.auto === "recurring") { const r = DB.recurring.find(x => x.id === t.recurring_id); if (r) r.next_due_date = t.date; }
        DB.transactions = DB.transactions.filter(x => x !== t); Store.touch("transactions", "recurring"); processInbox(); render(); toast("Zurück in Neue Umsätze"); break; }
      case "autook": DB.transactions.forEach(t => { if (t.auto) t.reviewed = true; }); Store.touch("transactions"); break;
      case "clearbankrules": if (confirm("Alle gelernten Gegenseiten löschen?")) { DB.bank_rules = []; Store.touch("bank_rules"); } break;
      case "deldepot": { const s = DB.depot_values.find(x => x.id === id); if (s && confirm("Stand vom " + dFmt(s.date) + " löschen" + (s.tx_id != null ? " (die zugehörige Rendite-Buchung wird auch entfernt)" : "") + "?")) { removeDepotValue(s); Store.touch("depot_values", "transactions"); } break; }
      case "gfopen": gfOpen = gfOpen === v ? null : v; render(); break;
      case "gfaccount": S.account = v; gfOpen = null; S.limit = 100; saveUI(); render(); break;
      case "gfmode": S.rmode = v; if (v === "custom") [S.from, S.to] = bounds(); saveUI(); render(); break;
      case "gfmonths": S.months = Number(v); S.rmode = "months"; gfOpen = null; S.limit = 100; saveUI(); render(); break;
      case "gfyear": S.rmode = "year"; S.year = v; gfOpen = null; S.limit = 100; saveUI(); render(); break;
      case "pick": await Store.pick(); render(); loadInbox(true); break;
      case "regrant": await Store.regrant(); render(); loadInbox(true); break;
      case "addtx": txDialog(); break;
      case "edittx": txDialog(DB.transactions.find(t => t.id === id)); break;
      case "closedlg": closeDialog(); break;
      case "deltx": trashTx([id]); break;
      case "restoretx": restoreTx([id]); break;
      case "purgetx": if (confirm("Endgültig löschen? Das lässt sich nicht rückgängig machen.")) { DB.trash = DB.trash.filter(t => t.id !== id); Store.touch("trash"); } break;
      case "emptytrash": if (confirm(`${DB.trash.length} Transaktionen endgültig löschen?`)) { DB.trash = []; Store.touch("trash"); } break;
      case "more": S.limit += 200; render(); break;
      case "selall": { const list = txFiltered().slice(0, S.limit); el.checked ? list.forEach(t => selected.add(t.id)) : list.forEach(t => selected.delete(t.id)); render(); break; }
      case "selrow": el.checked ? selected.add(id) : selected.delete(id); render(); break;
      case "bulkclear": selected.clear(); render(); break;
      case "bulkdel": trashTx([...selected]); selected.clear(); break;
      case "typefilter": S.type = v; saveUI(); render(); break;
      case "catview": S.catView = v; saveUI(); render(); break;
      case "bview": S.bview = v; saveUI(); render(); break;
      case "bsort": S.bsort = v; saveUI(); render(); break;
      case "tsort": S.tsort = v; saveUI(); render(); break;
      case "inclinv": S.inclInv = !S.inclInv; saveUI(); render(); break;
      case "incldepot": S.inclDepot = !S.inclDepot; saveUI(); render(); break;
      case "togcat": S.cats = S.cats.includes(id) ? S.cats.filter(x => x !== id) : [...S.cats, id]; saveUI(); render(); break;
      case "clearcats": S.cats = []; saveUI(); render(); break;
      case "hunit": S.hunit = v; saveUI(); render(); break;
      case "fixmode": S.fixmode = v; saveUI(); render(); break;
      case "rcat": S.rcat = v === "all" ? "all" : Number(v); saveUI(); render(); break;
      case "pickreceipt": $("#receiptFile")?.click(); break;
      case "receiptskip": receiptQueue.shift(); closeDialog(); if (receiptQueue.length) setTimeout(nextReceipt, 150); break;
      case "addrec": recDialog(); break;
      case "editrec": recDialog(DB.recurring.find(r => r.id === id)); break;
      case "delrec": if (confirm("Reihe löschen? Bereits gebuchte Transaktionen bleiben bestehen.")) { DB.transactions.forEach(t => { if (t.recurring_id === id) t.recurring_id = null; }); DB.recurring = DB.recurring.filter(r => r.id !== id); Store.touch("recurring", "transactions"); } break;
      case "recconf": bookRecurring(DB.recurring.find(r => r.id === id), false); toast("Gebucht"); break;
      case "recskip": bookRecurring(DB.recurring.find(r => r.id === id), true); break;
      case "addbudget": budgetDialog(); break;
      case "editbudget": budgetDialog(DB.budgets.find(b => b.id === id)); break;
      case "delbudget": if (confirm("Budget löschen?")) { DB.budgets = DB.budgets.filter(b => b.id !== id); Store.touch("budgets"); } break;
      case "addcat": catDialog(); break;
      case "editcat": catDialog(cat(id)); break;
      case "delcat": if (confirm("Kategorie löschen?")) { DB.categories = DB.categories.filter(c => c.id !== id); DB.budgets = DB.budgets.filter(b => b.category_id !== id); Store.touch("categories", "budgets"); } break;
      case "edittag": { const t = DB.tags.find(x => x.id === id), n = prompt("Neuer Name für den Tag:", t.name); if (n && n.trim() && n.trim() !== t.name) { t.name = n.trim().replace(/^#/, ""); DB.transactions.forEach(x => { if (x.tag_ids.includes(id)) x.description = withTags(x.description, x.tag_ids.map(tagName)); }); Store.touch("tags", "transactions"); } break; }
      case "deltag": if (confirm("Tag löschen? Er wird von allen Buchungen entfernt.")) { DB.transactions.forEach(x => { if (x.tag_ids.includes(id)) { x.tag_ids = x.tag_ids.filter(i => i !== id); x.description = withTags(x.description, x.tag_ids.map(tagName)); } }); DB.tags = DB.tags.filter(x => x.id !== id); Store.touch("tags", "transactions"); } break;
      case "addacc": { const n = $("#newAcc").value.trim(); if (n) { DB.accounts.push({ id: nextId(DB.accounts), name: n }); Store.touch("accounts"); } break; }
      case "delacc": DB.accounts = DB.accounts.filter(c => c.id !== id); DB.budgets = DB.budgets.filter(b => b.account_id !== id); Store.touch("accounts", "budgets"); break;
      case "clearrules": if (confirm("Alle gelernten Zuordnungen löschen?")) { DB.receipt_rules = []; Store.touch("receipt_rules"); } break;
      case "backupnow": await Store.dailyBackup(true); toast("Sicherung angelegt"); break;
      case "export": { const l = document.createElement("a"); l.href = URL.createObjectURL(new Blob([JSON.stringify(DB)], { type: "application/json" })); l.download = `trackmybudget-${todayStr()}.json`; l.click(); break; }
      case "import": $("#importFile").click(); break;
    }
  } catch (err) { if (err.name !== "AbortError") { console.error(err); toast("Fehler: " + err.message); } }
});
document.addEventListener("change", e => {
  const el = e.target, a = el.dataset?.act;
  if (el.id === "importFile" || el.id === "receiptFile") {
    const files = el.files; if (!files.length) return;
    if (el.id === "receiptFile") { enqueueReceipts(files); el.value = ""; return; }
    files[0].text().then(txt => { const o = JSON.parse(txt); if (!Array.isArray(o.transactions)) throw new Error("Keine gültige Datei"); if (!confirm(`${o.transactions.length} Buchungen importieren und die aktuellen Daten ersetzen?`)) return; FILES.forEach(k => DB[k] = o[k] || []); Store.touch(...FILES); toast("Importiert"); }).catch(err => toast("Fehler: " + err.message));
    return;
  }
  if (!a) return;
  switch (a) {
    case "from": S.from = el.value; break;
    case "to": S.to = el.value; break;
    case "catfilter": S.cat = el.value; break;
    case "tagfilter": S.tag = el.value; break;
    case "atag": S.atag = el.value; break;
    case "bulkcat": { if (!el.value) return; DB.transactions.forEach(t => { if (selected.has(t.id)) t.category_id = Number(el.value); }); selected.clear(); Store.touch("transactions"); return; }
    case "bankcatsel": if (el.value) { bookQueued(el.dataset.v, Number(el.value), true); toast("Gebucht und gemerkt"); } return;
    case "autocat": { const t = DB.transactions.find(x => x.id === Number(el.dataset.id)); if (!t) return; t.category_id = Number(el.value); t.reviewed = true; if (t.bank?.key && !t.split && !t.split_of && !t.recurring_id && !t.bank.key.startsWith("iban:")) upsertRule(t.bank.key, { category_id: t.category_id, ignore: false }); Store.touch("transactions", "bank_rules"); return; }
    case "banksinceset": { DB.bank_ack = DB.bank_ack.filter(a => a.kind !== "since"); if (el.value) DB.bank_ack.push({ id: el.value, kind: "since", at: todayStr() }); processInbox(); Store.touch("bank_ack"); return; }
    case "accname": { const x = acc(Number(el.dataset.id)); if (el.value.trim()) { x.name = el.value.trim(); Store.touch("accounts"); } return; }
    case "accweight": { const id = Number(el.dataset.id), w = parseAmount(el.value); if (w == null) return; const r = DB.account_weights.find(r => r.account_id === id && r.category_id == null && !r.start_date); if (r) r.weight = w; else DB.account_weights.push({ id: nextId(DB.account_weights), account_id: id, category_id: null, start_date: null, end_date: null, weight: w }); Store.touch("account_weights"); return; }
    default: return;
  }
  S.limit = 100; saveUI(); render();
});
const CALC_SEL = "input.amount, input[name=amount], input[name=value]";
function calcPreview(inp, hint) {
  let p = inp.nextElementSibling; if (!p || !p.classList.contains("calcprev")) { p = document.createElement("div"); p.className = "calcprev"; inp.after(p); }
  const t = inp.value.trim(); p.className = "calcprev";
  if (!t) p.textContent = hint ? "Du kannst rechnen, z. B. 12,50+3,20×2" : "";
  else if (isExpr(t)) { const v = parseAmount(t); if (v == null) { p.textContent = "Rechnung unvollständig"; p.classList.add("err"); } else { // Farbe nach Ergebnis: positiv grün, negativ rot
      p.classList.add(v < 0 ? "neg" : "pos");
      p.innerHTML = "= <b>" + eur(v) + "</b>"; } }
  else p.textContent = "";
}
document.addEventListener("focusin", e => { if (e.target.matches?.(CALC_SEL)) calcPreview(e.target, true); });
document.addEventListener("input", e => { if (e.target.matches?.(CALC_SEL)) calcPreview(e.target, true); });
// beim Verlassen des Felds steht das Ergebnis statt der Rechnung drin
document.addEventListener("focusout", e => { const i = e.target; if (i.matches?.(CALC_SEL) && isExpr(i.value)) { const v = parseAmount(i.value); if (v != null) { i.value = fmtNum(v); i.dispatchEvent(new Event("input", { bubbles: true })); } } });
document.addEventListener("input", e => { if (e.target.dataset?.act === "search") { S.search = e.target.value; S.limit = 100; saveUI(); render(); } });
document.addEventListener("submit", e => { if (e.target.id === "tagform") { e.preventDefault(); const n = $("#newTag").value.trim().replace(/^#/, ""); if (n) { resolveTags([n]); Store.touch("tags"); } } });
// Belege per Drag & Drop auf die ganze Seite
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
document.addEventListener("dragenter", e => { if (!hasFiles(e) || Store.mode === "none") return; dragDepth++; if (!$(".dropfull")) { const d = document.createElement("div"); d.className = "dropfull"; d.textContent = "Beleg hier ablegen"; document.body.append(d); } });
document.addEventListener("dragleave", e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $(".dropfull")?.remove(); } });
document.addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
document.addEventListener("drop", e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; $(".dropfull")?.remove(); if (Store.mode !== "none") enqueueReceipts(e.dataTransfer.files); });

/* ============================ Start ============================ */
Store.init().then(() => { render(); return loadInbox(); }).catch(e => { console.error(e); render(); });
window.addEventListener("focus", () => loadInbox()); setInterval(() => { if (!document.hidden) loadInbox(); }, 120000);
</script>
